name: Release Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {} # manual test build from any branch; skips the release job below

# Explicit least-privilege default for the whole workflow: workflow_dispatch
# means any branch with push access can trigger build-macos/build-windows,
# so they should never inherit a broader ambient GITHUB_TOKEN default than
# "read". Only the release job (tag pushes only, gated below) escalates to
# contents: write, and declares that itself.
permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS PKG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Build universal PKG
        working-directory: agent/installer/darwin
        run: bash build.sh universal

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: agent/installer/darwin/build/*.pkg

  build-windows:
    name: Build Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Install WiX Toolset v5
        run: dotnet tool install --global wix --version 5.0.2

      - name: Install WiX extensions
        working-directory: agent/installer
        run: |
          wix extension add WixToolset.Firewall.wixext/5.0.2
          wix extension add WixToolset.Util.wixext/5.0.2

      - name: Build MSI
        working-directory: agent/installer
        run: pwsh -File build.ps1

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: agent/installer/build/*.msi

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/') # manual workflow_dispatch runs stop at build artifacts, no release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-pkg
          path: dist/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
