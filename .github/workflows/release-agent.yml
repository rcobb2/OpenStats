name: Release Agent

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build macOS PKG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod

      - name: Build universal PKG
        working-directory: agent/installer/darwin
        run: bash build.sh universal

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: agent/installer/darwin/build/*.pkg

  build-windows:
    name: Build Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      - name: Install WiX extensions
        run: |
          wix extension add WixToolset.Firewall.wixext
          wix extension add WixToolset.Util.wixext

      - name: Build MSI
        working-directory: agent/installer
        run: pwsh -File build.ps1

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: agent/installer/build/*.msi

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-pkg
          path: dist/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
