name: Build and publish container image

# Builds the server image and publishes it to GHCR, tagged with the commit
# SHA (immutable — never :latest) so a deploy can pin an exact, reproducible
# image. Runs entirely on GitHub-hosted runners: this repo is public, so it
# deliberately has NO self-hosted runner and NO deploy secrets — see
# rcobb2/OpenStats-deploy (private) for the actual deploy step, which just
# bumps the tag referenced there.
on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push openstats-server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/rcobb2/openstats-server:${{ github.sha }}
            ghcr.io/rcobb2/openstats-server:latest
