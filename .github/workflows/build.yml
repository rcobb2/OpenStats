name: Build and publish container image

# Builds the server image and publishes it to GHCR, tagged with the commit
# SHA (immutable — never :latest) so a deploy can pin an exact, reproducible
# image. Runs entirely on GitHub-hosted runners: this repo is public, so it
# deliberately has NO self-hosted runner and NO deploy secrets — see
# rcobb2/OpenStats-deploy (private) for the actual deploy step, which just
# bumps the tag referenced there.
on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push openstats-server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./server
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: |
            ghcr.io/rcobb2/openstats-server:${{ github.sha }}
            ghcr.io/rcobb2/openstats-server:latest
