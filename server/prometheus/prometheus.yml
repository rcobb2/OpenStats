global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  # Scrape Prometheus itself for health monitoring.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ---------------------------------------------------------------
  # OpenLabStats Agents (push model via server aggregator)
  # ---------------------------------------------------------------
  # Agents push their /metrics output to POST /api/v1/agents/metrics
  # on the server every 30s. Prometheus scrapes the aggregated endpoint
  # at GET /metrics/agents instead of reaching agents directly on port 9183.
  - job_name: 'openlabstats'
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /metrics/agents
    static_configs:
      - targets: ['openstats-server:8080']
