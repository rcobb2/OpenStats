global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  # Scrape Prometheus itself for health monitoring.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ---------------------------------------------------------------
  # OpenLabStats Agents (push model via server aggregator)
  # ---------------------------------------------------------------
  # Agents push their /metrics output to POST /api/v1/agents/metrics
  # on the server every 30s. Prometheus scrapes the aggregated endpoint
  # at GET /metrics/agents instead of reaching agents directly on port 9183.
  - job_name: 'openlabstats'
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /metrics/agents
    static_configs:
      - targets: ['openstats-server:8080']
    # openlabstats_installed_software_info is a per-(name,version,publisher,hostname)
    # inventory gauge — one series per installed program per machine. At ~22k series
    # (56% of total TSDB on a ~600-agent fleet) it dominates ingestion/indexing load
    # and was measured adding ~2s of Prometheus query "prepare_time" to every report
    # panel, even though no report query touches it. Nothing currently queries this
    # Prometheus from Grafana in production (see git history for the investigation),
    # so drop it at ingestion rather than storing it. If per-device software inventory
    # reporting becomes a real feature, re-add with only {name, hostname} labels
    # (drop `version`/`publisher`) instead of restoring this.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'openlabstats_installed_software_info'
        action: drop
