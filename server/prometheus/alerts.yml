groups:
  - name: openlabstats_agent_health
    rules:
      # Agent is unreachable for more than 5 minutes.
      - alert: AgentDown
        expr: up{job="openlabstats"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OpenLabStats agent down on {{ $labels.instance }}"
          description: "Agent at {{ $labels.instance }} (lab: {{ $labels.lab }}) has been unreachable for 5 minutes."

      # No active user sessions on a device during business hours.
      # Useful for detecting idle lab machines.
      # Uncomment and adjust the schedule as needed.
      # - alert: DeviceIdleDuringHours
      #   expr: |
      #     (count by (instance) (openlabstats_user_session_active == 1) or vector(0)) == 0
      #     and ON() hour() >= 8 and ON() hour() <= 20
      #     and ON() day_of_week() >= 1 and ON() day_of_week() <= 5
      #   for: 2h
      #   labels:
      #     severity: info
      #   annotations:
      #     summary: "Lab device idle during business hours"
      #     description: "{{ $labels.instance }} has had no user sessions for 2+ hours during business hours."

  - name: openlabstats_usage
    rules:
      # Pre-computed recording rules for faster dashboard queries.

      # Total app usage seconds per app over the last 24 hours (human users only).
      - record: openlabstats:app_usage_24h:sum
        expr: sum by (app, category) (increase(openlabstats_app_usage_seconds_total{user!=""}[24h]))

      # Total app launches per app over the last 24 hours (human users only).
      - record: openlabstats:app_launches_24h:sum
        expr: sum by (app, category) (increase(openlabstats_app_launches_total{user!=""}[24h]))

      # Foreground (active) app seconds per lab over the last 24 hours (human
      # users only). Deliberately NOT app_usage_seconds_total: that metric is
      # process uptime, so every app a user leaves open accrues a second per
      # second and a lab's total runs many times past machines x hours. Only
      # foreground time is attributed to one app at a time, so per-lab totals
      # stay inside wall-clock reality. Same reasoning as usageByLabQuery in
      # server/internal/api/reports.go.
      - record: openlabstats:lab_usage_24h:sum
        expr: sum by (lab, app) (increase(openlabstats_app_foreground_seconds_total{user!=""}[24h]))

      # Active device count.
      - record: openlabstats:active_devices:count
        expr: count(up{job="openlabstats"} == 1)

      # Total unique apps in use right now.
      - record: openlabstats:active_apps:count
        expr: count(count by (app) (openlabstats_app_active == 1))

  # Pre-computed 15m deltas backing server/internal/api/reports.go's
  # arbitrary-range reports (?range=1h..30d). Those reports used to run
  # increase() over the raw counters directly for whatever window the caller
  # asked for — fine for 24h, but for this fleet's cardinality a 30-day window
  # means walking on the order of 500M+ raw samples per request, from scratch,
  # every time (measured in production: 14d ~8s, 21d ~15s, 25d+ exceeded a 45s
  # client timeout). These rules move that cost here, computed once per 15m
  # centrally, so a report query becomes sum_over_time() over ~2,880 points
  # (30d / 15m) instead of re-deriving from raw samples.
  #
  # Every label a live report currently filters or groups by is retained
  # (hostname for ?hostname=, user for the ignore-list matcher applied via
  # buildLabelFilters/buildUserSessionFilters, app/category for the app-centric
  # reports) so those filters keep working unchanged against the rollup —
  # only the metric name and increase()->sum_over_time() change at the query
  # site. Deliberately NOT by (lab, ...): usageByLabQuery already resolves lab
  # from the current DB assignment in Go rather than the Prometheus label, so
  # these rules don't need it.
  #
  # New rule = no history: a rule only starts accumulating from the moment
  # it's added, so a 30-day report is measured against a growing window of
  # real rollup data for the next 30 days after this ships, not a full 30
  # days immediately. Not backfilled (would need promtool tsdb
  # create-blocks-from rules run directly against podman02's TSDB).
  - name: openlabstats_report_rollups
    interval: 15m
    rules:
      - record: openlabstats:app_foreground_seconds:rate15m
        expr: sum by (hostname, app, category, user) (increase(openlabstats_app_foreground_seconds_total[15m]))

      # Backs topAppsUsageQuery ("Top Apps by Usage" / openstatsctl's
      # `top-apps`) — process uptime per app, deliberately not foreground
      # time (see that report's own comment for why). Added after the fact:
      # this site was missed when this group was first created and kept
      # reading the raw counter via increase() for arbitrary ranges.
      - record: openlabstats:app_usage_seconds:rate15m
        expr: sum by (hostname, app, category, user) (increase(openlabstats_app_usage_seconds_total[15m]))

      - record: openlabstats:app_launches:rate15m
        expr: sum by (hostname, app, category, user) (increase(openlabstats_app_launches_total[15m]))

      - record: openlabstats:privilege_elevations:rate15m
        expr: sum by (hostname, app, category, user) (increase(openlabstats_privilege_elevations_total[15m]))

      - record: openlabstats:user_session_logins:rate15m
        expr: sum by (hostname, user) (increase(openlabstats_user_session_logins_total[15m]))

      - record: openlabstats:user_session_seconds:rate15m
        expr: sum by (hostname, user) (increase(openlabstats_user_session_seconds_total[15m]))
