# OpenLabStats block for nginx-lb on podman01.
# Append this to /home/pathworks/nginx-proxy.conf, then reload:
#   podman exec nginx-lb nginx -s reload
#
# Prereq: issue cert before adding this block:
#   systemctl stop container-nginx-lb
#   certbot certonly --standalone -d openstats.colgate.edu \
#       --server https://acme.sectigo.com/v2/InCommonRSAOV \
#       --agree-tos --email <your-email>
#   systemctl start container-nginx-lb

server {
    listen 80;
    server_name openstats.colgate.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name openstats.colgate.edu;

    ssl_certificate     /etc/letsencrypt/live/openstats.colgate.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openstats.colgate.edu/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket support (needed for Grafana Live).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://host.containers.internal:8080;
    }
}
